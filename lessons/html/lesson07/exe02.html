<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liste ordinate e non ordinate</title>
  </head>
  <body>
    <h1>Liste</h1>

    <h2>Lista Ordinata</h2>
    <ol>
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
      <li>Item 5</li>
      <li>Item 5</li>
    </ol>

    <h2>Lista non Ordinata</h2>
    <ul>
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
      <li>Item 5</li>
      <li>Item 5</li>
    </ul>
  </body>
</html>
