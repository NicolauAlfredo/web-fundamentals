<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Develhope</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo">
          <img src="https://placehold.co/60x40" alt="Logo de Develhope" />
          <h1>Develhope</h1>
        </div>

        <nav class="navbar">
          <ul class="navbar__menu">
            <li><a href="#">Link 1</a></li>
            <li><a href="#">Link 2</a></li>
            <li><a href="#">Link 3</a></li>
            <li><a href="#">Link 4</a></li>
          </ul>
        </nav>
      </header>

      <main>
        <aside>
          <ul class="navbar__aside">
            <li><a href="#">Link 1</a></li>
            <li><a href="#">Link 2</a></li>
            <li><a href="#">Link 3</a></li>
            <li><a href="#">Link 4</a></li>
          </ul>
        </aside>

        <div>
          <article>
            <h2>Titolo articolo</h2>
            <div>
              <img src="https://placehold.co/500x150" alt="Articolo" />
              <p>
                Lorem ipsum dolor, sit amet consectetur adipisicing elit.
                Delectus nemo voluptatum sed eaque. Voluptatibus, magni.
              </p>
            </div>
          </article>

          <section>
            <h3>Commenti</h3>
            <form>
              <label for="name">Nome</label>
              <input type="text" name="name" id="name" required />

              <label for="email">E-mail</label>
              <input type="email" name="email" id="email" required />

              <label for="message">Messagio</label>
              <textarea
                name="message"
                id="message"
                cols="30"
                rows="2"
              ></textarea>

              <input type="submit" value="Invia" />
            </form>
          </section>
        </div>
      </main>

      <footer>
        <h4>Contatti</h4>
        <p>E-mail</p>
        <a href="mailto:info@develhope.co">info@develhope.co</a>
        <p>Tel.</p>
        <a href="#">341 932 5321</a>
      </footer>
    </div>
  </body>
</html>
