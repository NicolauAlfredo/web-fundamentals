<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lezione 09 - HTML</title>

    <style>
      table {
        border-collapse: collapse;
        border: 1px solid rgb(200, 200, 200);
        letter-spacing: 1px;
        font-size: 0.8rem;
      }
      td,
      th {
        border: 1px solid rgb(190, 190, 190);
        padding: 10px 20px;
      }
    </style>
  </head>
  <body>
    <table>
      <caption>
        Gli Eroi
      </caption>
      <colgroup>
        <col style="background-color: yellow" />
        <col />
        <col />
      </colgroup>

      <thead>
        <tr>
          <th>Nome</th>
          <th>Arma</th>
          <th>Veicolo</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>Batman</td>
          <td>Batrang</td>
          <td>Batmobile</td>
        </tr>

        <tr>
          <td>Superman</td>
          <td>Superforza</td>
          <td>Se stesso!</td>
        </tr>

        <tr>
          <td>Wonder Woman</td>
          <td>Lazo della Verità</td>
          <td>Jet Invisibile</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <td colspan="2">Il più figo però è:</td>
          <td>Batman</td>
        </tr>
      </tfoot>
    </table>
    
  </body>
</html>
